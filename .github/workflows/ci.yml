name: Windows tests and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - name: Install dependencies
        run: python -m pip install -r source/requirements.txt PyInstaller==6.22.3
      - name: Test, build and inspect release
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: dist/*
          if-no-files-found: error
